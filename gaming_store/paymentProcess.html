<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <header class="header">
        <div class="logo">Gaming Store</div>
        <nav>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="setup.html">Custiamza  Setup</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button id="signInButton">Sign In</button>
        </div>
    </header>

    <div class="payment-container">
        <h2>Review Your Order</h2>
        <div id="cart-items">
            <!-- Items will be dynamically inserted here -->
        </div>
        <p class="total">Total Amount: ₹<span id="total-amount">0</span></p>

        <h2>Payment Details</h2>
        <form id="payment-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="address">Billing Address:</label>
            <input type="text" id="address" placeholder="Enter your address" required>

            <label>Payment Method:</label>
            <div class="payment-method">
                <input type="radio" name="payment" id="card" value="card" checked>
                <label for="card">Credit/Debit Card</label>

                <input type="radio" name="payment" id="upi" value="upi">
                <label for="upi">UPI</label>

                <input type="radio" name="payment" id="paypal" value="paypal">
                <label for="paypal">PayPal</label>
            </div>

            <div id="card-details">
                <label for="card-number">Card Number:</label>
                <input type="text" id="card-number" placeholder="XXXX-XXXX-XXXX-XXXX" required>

                <label for="expiry">Expiry Date:</label>
                <input type="text" id="expiry" placeholder="MM/YY" required>

                <label for="cvv">CVV:</label>
                <input type="password" id="cvv" placeholder="123" required>
            </div>

            <button type="submit" id="pay-now">Proceed to Pay</button>
        </form>
    </div>

    <script src="payment.js"></script>
</body>
</html>
