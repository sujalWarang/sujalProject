<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin_dashboard.css">
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="admin_dashboard.html">🏠 Dashboard</a></li>
            <li><a href="products.html">🛒 Products</a></li>
            <li><a href="sales.html" class="active">📈 Sales Overview</a></li>
            <li><a href="purchase_history.html">📜 Purchase History</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h2>Dashboard</h2>
        </header>
        
        <section id="products">
            <h2>Manage Products</h2>
            <button class="btn" id="show-form-btn">Add Product</button>
            <div id="product-form" style="display: none;">
                <input type="text" id="product-name" placeholder="Product Name" required>
                <input type="text" id="product-brand" placeholder="Brand" required>
                <select id="product-category" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="Mouse">Mouse</option>
                    <option value="Keyboard">Keyboard</option>
                    <option value="Headset">Headset</option>
                    <option value="Monitor">Monitor</option>
                </select>
                <input type="number" id="product-price" placeholder="Price" required>
                <input type="file" id="product-image" placeholder="Image URL" required>
                <textarea id="product-feature" placeholder="Feature"></textarea>
                <button class="btn" id="add-product-btn">Submit</button>
            </div>

            <h3>Recently Added Products</h3>
            <ul id="recent-products"></ul>

            <div id="message"></div>
        </section>
    </div>

    <script>
        document.getElementById("show-form-btn").addEventListener("click", function() {
            const form = document.getElementById("product-form");
            form.style.display = form.style.display === "none" ? "block" : "none";
        });

        document.getElementById("add-product-btn").addEventListener("click", async function() {
            const product = {
                name: document.getElementById("product-name").value,
                brand: document.getElementById("product-brand").value,
                category: document.getElementById("product-category").value,
                price: document.getElementById("product-price").value,
                image: document.getElementById("product-image").value,
                feature: document.getElementById("product-feature").value
            };

            await fetch("http://localhost:3000/add-product", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(product)
            });

            loadRecentProducts();
        });

        async function loadRecentProducts() {
            const response = await fetch("http://localhost:3000/get-products");
            const products = await response.json();
            document.getElementById("recent-products").innerHTML = products.map(p => `<li>${p.name} - ₹${p.price}</li>`).join("");
        }

        loadRecentProducts();
    </script>

</body>
</html>
