<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="product-card.css">
</head>
<body>

    <header class="header">
        <div class="logo">Gaming Store</div>
        <nav>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="setup.html">Custiamza Setup</a></li>
                <li><a href="help.html">Help</a></li>
                <li><a href="admin_login.html">Admin</a></li>
            </ul>

        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search products...">
            <button>Search</button>
        </div>
        <div class="user-actions">
            <a href="login.html"><button id="signInButton">Sign In</button></a>
        </div>
    </header>

    <div class="product-card">
        <img src="images/Razermouse.webp" alt="Gaming Mouse" class="product-image">
        <div class="product-info">
            <h2 class="product-title">Razer Gaming Mouse</h2>
            <p class="product-price">$49.99</p>
            <p class="product-description">A high-precision gaming mouse with customizable RGB lighting and ultra-responsive sensors.</p>
            <p class="product-stock">Stock: <span class="in-stock">Available</span></p>
            <div class="product-rating">
                ⭐⭐⭐⭐⭐ (4.8/5)
            </div>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </div>

</body>
</html>
