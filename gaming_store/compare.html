<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Products</title>
    <link rel="stylesheet" href="compare.css">
</head>
<body>
<header class="header">
    <div class="logo">Gaming Store</div>
    <nav>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="compare.html">compare</a></li>
            <li><a href="setup.html">Custiamza Setup</a></li>
            <li><a href="help.html">Help</a></li>
        </ul>
    </nav>
    <div class="search-bar">
        <input type="text" placeholder="Search products...">
        <button>Search</button>
    </div>
    <div class="user-actions">
       
        <button id="signInButton">Sign In</button>
    </div>
</header>

    <h1>Compare Gaming Accessories</h1>
    <form id="compare-form">
        <div class="product-select">
            <label for="product1">Select Product 1:</label>
            <select id="product1" name="product1"></select>
        </div>
        <div class="product-select">
            <label for="product2">Select Product 2:</label>
            <select id="product2" name="product2"></select>
        </div>
        <button type="button" onclick="compareProducts()">Compare</button>
    </form>
    <div id="comparison-result"></div>

    <script src="compare.js"></script>
</body>
</html>
