<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="stylesheet" href="products.css">
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="admin_dashboard.html">🏠 Dashboard</a></li>
            <li><a href="products.html" class="active">🛒 Products</a></li>
            <li><a href="sales.html">📈 Sales Overview</a></li>
            <li><a href="purchase_history.html">📜 Purchase History</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h2>Manage Products</h2>
        </header>

        <section class="product-section">
            <button class="btn" id="manage-product-btn">Manage Products</button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Brand</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Image</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <!-- Product rows will be added dynamically from the database -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="products.js"></script>
</body>
</html>
